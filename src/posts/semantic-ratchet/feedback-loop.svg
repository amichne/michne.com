<svg xmlns="http://www.w3.org/2000/svg" width="480" height="520" viewBox="0 0 480 520" role="img" aria-labelledby="title desc">
  <title id="title">Use precise feedback to refine a candidate</title>
  <desc id="desc">Intent and source evidence inform a candidate change. Compiler, schema, and behavioral checks reject violations and guide revision. Accepted candidates still need review and evidence for external effects.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#787366"/></marker>
  </defs>
  <rect width="480" height="520" rx="8" fill="#f5f0e5"/>
  <g fill="none" stroke="#787366" stroke-width="2" marker-end="url(#arrow)">
    <path d="M240 94V134"/><path d="M240 200V240"/>
    <path d="M240 322V352H140V390"/><path d="M240 322V352H350V390"/>
    <path d="M40 432H18V167H70"/>
  </g>
  <g stroke-width="1.5">
    <rect x="70" y="28" width="340" height="66" rx="8" fill="#eee8db" stroke="#787366"/>
    <rect x="70" y="134" width="340" height="66" rx="8" fill="#eee8db" stroke="#787366"/>
    <rect x="70" y="240" width="340" height="82" rx="8" fill="#eee8db" stroke="#787366"/>
    <rect x="40" y="390" width="200" height="84" rx="8" fill="#f2e3db" stroke="#a45b43"/>
    <rect x="260" y="390" width="180" height="84" rx="8" fill="#e4ebe4" stroke="#4f7463"/>
  </g>
  <g fill="#38352f" font-family="Courier New, monospace" font-size="19" text-anchor="middle">
    <text x="240" y="57">Intent and source evidence</text>
    <text x="240" y="80" fill="#686354" font-size="16">Make the obligations explicit</text>
    <text x="240" y="163">Candidate change</text>
    <text x="240" y="186" fill="#686354" font-size="16">Human or AI author</text>
    <text x="240" y="268">Compiler, schemas, assertions</text>
    <text x="240" y="291" fill="#686354" font-size="16">Each examines its own obligation</text>
    <text x="140" y="419">Reject and revise</text>
    <text x="140" y="442" fill="#8a4230" font-size="14">Preserve the diagnostic</text>
    <text x="350" y="419">Review behavior</text>
    <text x="350" y="442" fill="#385e4c" font-size="13">Prove external effects</text>
    <text x="240" y="500" fill="#686354" font-size="15">Acceptance proves only the examined obligations.</text>
  </g>
</svg>
